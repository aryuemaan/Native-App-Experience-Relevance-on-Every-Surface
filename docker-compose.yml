services:
  gateway:
    build: ./services/gateway
    environment:
      NODE_ENV: production
      PORT: "8080"
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    ports:
      - "8080:8080"

  gateway-rs:
    build: ./services/gateway-rs
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      RUST_LOG: info
      CARE_GATE_ENABLED: "true"
      CONSENT_TCF_VERSION: "2.2"
    ports:
      - "8081:8080"

  surface-demo:
    build:
      context: ./apps/surface-demo
      args:
        VITE_GATEWAY_URL: "http://localhost:8080"
    ports:
      - "5173:80"
    depends_on:
      - gateway
